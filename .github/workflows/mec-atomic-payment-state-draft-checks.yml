name: MEC atomic payment-state draft checks

on:
  pull_request:
    branches:
      - main
      - feat/mec-checkout-duitku-pop
    paths:
      - 'supabase/functions/mec-duitku-create-invoice/**'
      - 'supabase/functions/mec-duitku-callback/**'
      - 'supabase/functions/mec-duitku-payment-status/**'
      - 'supabase/migrations/20261023110000_mec_atomic_duitku_invoice_result.sql'
      - 'supabase/migrations/20261023110001_mec_status_rate_limit.sql'
      - 'tests/sql/mec-atomic-invoice-result.sql'
      - 'tests/sql/mec-callback-reservation-release-race.sh'
      - 'tests/sql/mec-reservation-release-before-callback-race.sh'
      - 'src/pages/Cart.tsx'
      - 'docs/MEC_DUITKU_EDGE_FUNCTIONS.md'
      - '.github/workflows/mec-atomic-payment-state-draft-checks.yml'

permissions:
  contents: read

jobs:
  deno-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check MEC order and payment functions
        run: |
          deno check supabase/functions/mec-create-order/index.ts
          deno check supabase/functions/mec-duitku-create-invoice/index.ts
          deno check supabase/functions/mec-duitku-callback/index.ts
          deno check supabase/functions/mec-duitku-payment-status/index.ts

  frontend-build-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install locked dependencies without install hooks
        run: npm ci --ignore-scripts
      - name: Type-check and production build
        run: npm run build
      - name: Lint frontend
        run: npm run lint
      - name: Validate disposable race-test shell syntax
        run: |
          bash -n tests/sql/mec-callback-reservation-release-race.sh
          bash -n tests/sql/mec-reservation-release-before-callback-race.sh
