name: MEC payment status checks

on:
  pull_request:
  push:
    branches:
      - feat/mec-payment-status-api-v1

permissions:
  contents: read

jobs:
  status-api-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run MEC status authorization and rate-limit tests
        run: deno test supabase/functions/mec-duitku-payment-status/authorization_test.ts supabase/functions/mec-duitku-payment-status/rate_limit_test.ts

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build frontend
        run: npm run build
